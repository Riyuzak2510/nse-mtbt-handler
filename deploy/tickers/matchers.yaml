apiVersion: apps/v1
kind: Deployment
metadata: {name: ticker-matcher-1}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: ticker-matcher-1}}
  template:
    metadata: {labels: {app: ticker-matcher-1}}
    spec:
      nodeSelector: {mtbt.lane: b}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ticker-matcher
          image: nse-mtbt-handler:lab
          imagePullPolicy: IfNotPresent
          command: [/app/ticker-matcher]
          args: ["-manifest=/config/manifest.json", "-token=1", "-http=0.0.0.0:19007", "-allow-non-loopback", "-max-active=100000"]
          env:
            - {name: NATS_URL, valueFrom: {secretKeyRef: {name: mtbt-credentials, key: NATS_URL}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: mtbt-credentials, key: DATABASE_URL}}}
            - {name: GOMEMLIMIT, value: 384MiB}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 19007}]
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 60}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2}
          volumeMounts: [{name: config, mountPath: /config, readOnly: true}]
      volumes: [{name: config, configMap: {name: mtbt-source}}]
---
apiVersion: v1
kind: Service
metadata: {name: ticker-matcher-1}
spec:
  selector: {app: ticker-matcher-1}
  ports: [{name: http, port: 19007, targetPort: http}]
---
